<svg xmlns="http://www.w3.org/2000/svg" width="940" height="492" viewBox="0 0 940 492"><rect width="940" height="492" fill="#FFFFFF"/><text x="20" y="30" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#181818">D6 · Editor mobile — onde o conteúdo do CCU divergiu</text><text x="20" y="50" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#6B6B6B">Editor &gt; ícone de celular no topo. No Wix clássico o layout mobile é EDITADO SEPARADAMENTE.</text><text x="920" y="30" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10" fill="#6B6B6B">ESQUEMA — não é captura de tela do Wix</text><rect x="20" y="66" width="900" height="40" rx="6" fill="#F7F7F8" stroke="#D8D8D8"/><rect x="34" y="74" width="120" height="24" rx="5" fill="#181818"/><text x="94.0" y="90.5" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Desktop</text><rect x="162" y="74" width="120" height="24" rx="5" fill="#C1272D"/><text x="222.0" y="90.5" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Mobile</text><text x="300" y="91" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" fill="#6B6B6B">alternar aqui — toda alteração de layout precisa ser feita nos DOIS</text><rect x="20" y="120" width="435" height="268" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="32" y="141" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Desktop hoje — /prep4consulting-2026-2</text><text x="38" y="168.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Ciclo 1</text><text x="38" y="195.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Prep 101 · Consulting 101 · Screening</text><text x="38" y="222.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Ciclo 2</text><text x="38" y="249.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Ciclo 3</text><text x="38" y="276.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Finanças · Framework · Fit · Case · GMAT…</text><text x="38" y="303.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Ciclo 4</text><rect x="34" y="322" width="405" height="46" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="44" y="341" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">PROBLEMA: Ciclo 2 e 3 colados, módulos despejados; falta o</text><text x="44" y="356" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">módulo Estrutura do PS</text><rect x="485" y="120" width="435" height="268" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="497" y="141" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Mobile hoje — mesma página</text><text x="503" y="168.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Ciclo 1</text><text x="503" y="195.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Prep 101 · Consulting101 · Screening · Estrutura do PS</text><text x="503" y="222.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Ciclo 2</text><text x="503" y="249.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">GMAT ×4 · Business Case Test</text><text x="503" y="276.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Ciclo 3</text><text x="503" y="303.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#C1272D">Faça perguntas de clarificação  (texto solto)</text><rect x="499" y="322" width="405" height="46" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="509" y="341" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Ordem dos ciclos correta, mas com 2 textos colados de</text><text x="509" y="356" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">/entrevista</text><rect x="20" y="408" width="900" height="46" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="30" y="427" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Regra operacional: depois de QUALQUER mudança de layout no desktop, abra o editor mobile e confira a mesma seção antes de publicar. Foi a falta</text><text x="30" y="442" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">desse passo que fez o desktop perder um módulo do curso e o mobile ganhar dois textos que não pertencem a ele.</text></svg>