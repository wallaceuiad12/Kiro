<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420"><rect width="940" height="420" fill="#FFFFFF"/><text x="20" y="30" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#181818">D7 · Desinstalar apps — ocultar a página não resolve</text><text x="20" y="50" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#6B6B6B">Painel do site &gt; Apps &gt; Gerenciar Apps. Remove a página, o script e o ícone do carrinho.</text><text x="920" y="30" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10" fill="#6B6B6B">ESQUEMA — não é captura de tela do Wix</text><rect x="20" y="66" width="900" height="250" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="32" y="87" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Gerenciar Apps</text><rect x="34" y="100" width="872" height="28" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="118" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Wix Events</text><text x="190" y="118" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">vende o Prep4Consulting</text><text x="896" y="118" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#1E7A45">MANTER</text><rect x="34" y="130" width="872" height="28" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="148" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Wix Stores</text><text x="190" y="148" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">/shop sem produtos + carrinho no topo de todas as páginas</text><text x="896" y="148" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#C1272D">DESINSTALAR</text><rect x="34" y="160" width="872" height="28" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="178" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Wix Forum</text><text x="190" y="178" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">/forum exibe “Widget Didn’t Load”</text><text x="896" y="178" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#C1272D">DESINSTALAR</text><rect x="34" y="190" width="872" height="28" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="208" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Wix Loyalty</text><text x="190" y="208" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">/loyalty em inglês, recompensa loja vazia</text><text x="896" y="208" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#C1272D">DESINSTALAR</text><rect x="34" y="220" width="872" height="28" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="238" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Wix Bookings</text><text x="190" y="238" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">/book-online travado em “Carregando os dias…”</text><text x="896" y="238" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#C1272D">DESINSTALAR</text><rect x="34" y="250" width="872" height="28" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="268" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Members Area</text><text x="190" y="268" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">/members totalmente vazia</text><text x="896" y="268" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#C1272D">DESINSTALAR</text><rect x="34" y="280" width="872" height="28" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="298" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Wix Blog</text><text x="190" y="298" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">/blog sem nenhum post</text><text x="896" y="298" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#C1272D">DESINSTALAR</text><rect x="20" y="326" width="900" height="61" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="30" y="345" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">O ícone de carrinho com “0” aparece no cabeçalho de TODAS as páginas do site porque o Wix Stores está instalado — inclusive nas páginas de</text><text x="30" y="360" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">conteúdo gratuito. Desinstalar o app remove o carrinho. Depois de desinstalar, crie os 301 (D3): /shop &gt; /prep4consulting, /forum &gt; /conteudo,</text><text x="30" y="375" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">/members &gt; /processo-seletivo.</text></svg>