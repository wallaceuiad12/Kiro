stroke="#7BE0A0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><text x="506" y="354" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="#C1272D">Vermelho da marca — 3,0:1 FALHA</text><path d="M884 345 l9 9 M893 345 l-9 9" fill="none" stroke="#FF8A8A" stroke-width="2.1" stroke-linecap="round"/><rect x="20" y="396" width="900" height="61" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="30" y="415" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Descoberta: a paleta do CCU foi desenhada para as peças de fundo ESCURO do Instagram/LinkedIn. Os rosas do CWC e os cinzas passam AA em fundo</text><text x="30" y="430" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">escuro e falham em fundo claro; o vermelho da marca faz o oposto. Se a seção do site tem fundo claro, use #181818/#515151/#C1272D. Se tiver fundo</text><text x="30" y="445" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">escuro, aí sim os rosas funcionam.</text></svg>