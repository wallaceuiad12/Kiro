<svg xmlns="http://www.w3.org/2000/svg" width="940" height="496" viewBox="0 0 940 496"><rect width="940" height="496" fill="#FFFFFF"/><text x="20" y="30" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#181818">D4 · Temas de Texto — a correção de maior alcance</text><text x="20" y="50" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#6B6B6B">Editor &gt; Site &gt; Temas de Texto. Muda a tipografia de TODO o site de uma vez.</text><text x="920" y="30" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10" fill="#6B6B6B">ESQUEMA — não é captura de tela do Wix</text><rect x="20" y="66" width="430" height="340" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="32" y="87" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Temas de Texto</text><rect x="34" y="96" width="400" height="44" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="115" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#181818">Título 1</text><text x="46" y="132" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">Brandon Grotesque Light</text><text x="424" y="122" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#C1272D">88 &gt; 44 px</text><rect x="34" y="146" width="400" height="44" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="165" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#181818">Título 2</text><text x="46" y="182" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">Brandon Grotesque Light</text><text x="424" y="172" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#C1272D">72 &gt; 32 px</text><rect x="34" y="196" width="400" height="44" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="215" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#181818">Título 3</text><text x="46" y="232" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">Brandon Grotesque Light</text><text x="424" y="222" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#C1272D">28 &gt; 24 px</text><rect x="34" y="246" width="400" height="44" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="265" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#181818">Parágrafo 1</text><text x="46" y="282" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">Avenir LT 35 Light</text><text x="424" y="272" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#1E7A45">20 px</text><rect x="34" y="296" width="400" height="44" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="315" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#181818">Parágrafo 2</text><text x="46" y="332" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">Avenir LT 35 Light</text><text x="424" y="322" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#1E7A45">18 px</text><rect x="34" y="346" width="400" height="44" rx="5" fill="#FFF" stroke="#D8D8D8"/><text x="46" y="365" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#181818">Legenda</text><text x="46" y="382" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">Avenir LT 35 Light</text><text x="424" y="372" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#1E7A45">14 px</text><defs><marker id="a5039" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C1272D"/></marker></defs><line x1="452" y1="240" x2="500" y2="240" stroke="#C1272D" stroke-width="2" marker-end="url(#a5039)"/><rect x="510" y="66" width="410" height="200" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="522" y="87" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Painel de uma caixa de texto</text><text x="528" y="118.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B6B">Tema</text><rect x="524" y="122" width="382" height="32" rx="5" fill="#FFF" stroke="#C1272D" stroke-width="1.6"/><text x="536" y="143" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Parágrafo 2</text><text x="890" y="143" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="#6B6B6B">v</text><rect x="510" y="172" width="410" height="61" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="520" y="191" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Selecione TODO o texto da caixa (Ctrl+A)</text><text x="520" y="206" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">antes de escolher o tema — só assim a</text><text x="520" y="221" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">formatação manual antiga é descartada.</text><rect x="510" y="282" width="410" height="61" rx="5" fill="#FFF8F8" stroke="#1E7A45" stroke-width="1.2"/><text x="520" y="301" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Hoje: 3.948 formatações manuais</text><text x="520" y="316" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">46 tamanhos de fonte · 34 famílias</text><text x="520" y="331" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Alvo: 6 temas, 2 famílias, 0 manual</text><rect x="20" y="424" width="900" height="46" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="30" y="443" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Por que isso primeiro: o site JÁ tem os temas certos configurados (Brandon Grotesque para título, Avenir para corpo). O problema é que cada caixa</text><text x="30" y="458" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">de texto sobrescreve o tema. Arrumar o tema conserta o site inteiro; arrumar caixa por caixa não escala.</text></svg>