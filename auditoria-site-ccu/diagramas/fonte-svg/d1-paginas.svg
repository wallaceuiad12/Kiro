<svg xmlns="http://www.w3.org/2000/svg" width="940" height="492" viewBox="0 0 940 492"><rect width="940" height="492" fill="#FFFFFF"/><text x="20" y="30" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#181818">D1 · Menus e Páginas — ocultar NÃO é excluir</text><text x="20" y="50" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#6B6B6B">Editor &gt; painel esquerdo &gt; Menus e Páginas. A distinção que gerou 21 páginas órfãs no site do CCU.</text><text x="920" y="30" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10" fill="#6B6B6B">ESQUEMA — não é captura de tela do Wix</text><rect x="20" y="66" width="330" height="330" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="32" y="87" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Menus e Páginas</text><text x="38" y="114.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Início</text><text x="38" y="144.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Sobre nós</text><text x="38" y="174.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Projetos</text><text x="324" y="174.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">pasta</text><text x="38" y="204.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Parceiros</text><text x="324" y="204.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">âncora</text><text x="38" y="234.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Conteúdo</text><text x="324" y="234.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">pasta</text><text x="38" y="264.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Alumni</text><text x="38" y="294.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#181818">Mailing</text><rect x="34" y="306" width="300" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="44" y="324.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">blank-1</text><text x="324" y="324.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">oculta</text><rect x="34" y="336" width="300" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="44" y="354.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">blank-6</text><text x="324" y="354.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">oculta</text><defs><marker id="a72358" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C1272D"/></marker></defs><line x1="352" y1="366" x2="402" y2="366" stroke="#C1272D" stroke-width="2" marker-end="url(#a72358)"/><rect x="410" y="66" width="510" height="330" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="422" y="87" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Menu de contexto da página (engrenagem)</text><rect x="424" y="100" width="480" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="434" y="118.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B6B">Configurações</text><rect x="424" y="138" width="480" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="434" y="156.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#1A6FD4">SEO básico</text><text x="894" y="156.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">slug, título, descrição</text><rect x="424" y="176" width="480" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="434" y="194.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#B8860B">Ocultar do menu</text><text x="894" y="194.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">CONTINUA publicada e indexável</text><rect x="424" y="214" width="480" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="434" y="232.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#B8860B">Ocultar dos motores de busca</text><text x="894" y="232.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">sai do Google, segue no ar</text><rect x="424" y="252" width="480" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="434" y="270.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#C1272D">Duplicar</text><text x="894" y="270.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">origem dos slugs blank-N</text><rect x="424" y="290" width="480" height="27" rx="5" fill="#FFFFFF" stroke="#D8D8D8"/><text x="434" y="308.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1E7A45">Excluir</text><text x="894" y="308.0" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">remove de verdade — use com 301</text><rect x="20" y="406" width="900" height="61" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="30" y="425" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Regra: “Ocultar do menu” deixa a página publicada, no sitemap e no Google. Foi assim que /blank-1 (“Site em manutenção”) e /blank-6 (Processo</text><text x="30" y="440" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Seletivo) continuaram no ar.</text><text x="30" y="455" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Quando a página não serve mais: Excluir + criar o redirecionamento 301 (ver D3). Nunca duplicar página para criar a edição seguinte.</text></svg>