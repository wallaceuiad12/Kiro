<svg xmlns="http://www.w3.org/2000/svg" width="940" height="344" viewBox="0 0 940 344"><rect width="940" height="344" fill="#FFFFFF"/><text x="20" y="30" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#181818">D10 · Texto alternativo — hoje o alt é o nome do arquivo</text><text x="20" y="50" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#6B6B6B">Clicar na imagem &gt; Configurações &gt; Texto alternativo (ou pelo Gerenciador de Mídia).</text><text x="920" y="30" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10" fill="#6B6B6B">ESQUEMA — não é captura de tela do Wix</text><rect x="20" y="66" width="440" height="190" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="32" y="87" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Como está</text><rect x="34" y="96" width="120" height="84" rx="4" fill="#E8E8E8" stroke="#D8D8D8"/><text x="94" y="142" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">cronograma</text><text x="168" y="112" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">alt =</text><text x="168" y="132" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#C1272D">cronograma-prep4consulting</text><text x="168" y="149" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#C1272D">-2026-2_5.png</text><text x="168" y="178" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">e as datas do curso só existem</text><text x="168" y="192" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">dentro da imagem</text><defs><marker id="a28309" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C1272D"/></marker></defs><line x1="464" y1="160" x2="508" y2="160" stroke="#C1272D" stroke-width="2" marker-end="url(#a28309)"/><rect x="520" y="66" width="400" height="190" rx="7" fill="#F7F7F8" stroke="#D8D8D8" stroke-width="1.2"/><text x="532" y="87" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#181818">Como deve ficar</text><rect x="534" y="96" width="120" height="84" rx="4" fill="#E8E8E8" stroke="#D8D8D8"/><text x="594" y="142" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">cronograma</text><text x="668" y="112" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#6B6B6B">alt =</text><text x="668" y="132" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#1E7A45">“Cronograma do Prep4Consulting</text><text x="668" y="149" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#1E7A45">2026.2: 11 encontros ao vivo”</text><text x="668" y="178" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">+ as datas repetidas como</text><text x="668" y="192" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" fill="#6B6B6B">TEXTO ou tabela na página</text><rect x="20" y="266" width="900" height="46" rx="5" fill="#FFF8F8" stroke="#C1272D" stroke-width="1.2"/><text x="30" y="285" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">Duas imagens da página do curso estão com alt vazio e quatro têm o nome do arquivo como alt (“hq1_edited.png”,</text><text x="30" y="300" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#181818">“y8-PTBaP90a-removebg-preview.png”…). Imagem decorativa pode ter alt vazio de propósito; imagem que carrega informação, nunca.</text></svg>